gg:
    jte:
        development-mode: false
        use-precompiled-templates: true

spring:
    application:
        name: NBH

    mvc:
        hiddenmethod:
            filter:
                enabled: true

    datasource:
        url: ${DATABASE_URL}
        username: ${PGUSER}
        password: ${PGPASSWORD}

    jpa:
        show-sql: false
        open-in-view: false
        properties:
            hibernate:
                format_sql: false

    mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT}
        username: ${PROD_MAIL_USERNAME}
        password: ${PROD_MAIL_PASSWORD}
        protocol: smtp
        default-encoding: UTF-8
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true

logging:
    level:
        org.springframework.web.servlet: WARN
        eu.nabahilfe: INFO

server:
    port: ${PORT:8080}
    servlet:
        session:
            timeout: 30m
            cookie:
                secure: true
                http-only: true
                same-site: lax

app:
    base-url: ${APP_BASE_URL}

