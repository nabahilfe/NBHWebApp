<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#198754">
    <meta name="robots" content="noindex, nofollow">

    <title>Nachbarschaftshilfe Maria Anzbach – Wartungsarbeiten</title>

    <style>
        :root {
            --primary: #198754;
            --primary-dark: #146c43;
            --primary-light: #eaf6ef;
            --text: #343a40;
            --muted: #6c757d;
            --background: #f5f8f6;
            --surface: #ffffff;
            --border: #dfe9e3;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: var(--text);
            background:
                radial-gradient(
                    circle at top,
                    #ffffff 0,
                    var(--background) 60%
                );
        }

        .page {
            width: 100%;
            max-width: 680px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 48px 42px 40px;
            text-align: center;

            box-shadow:
                0 10px 35px rgba(20, 108, 67, 0.08);
        }

        .logo-mark {
            width: 76px;
            height: 76px;
            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);

            font-size: 34px;
            font-weight: 700;

            border: 1px solid rgba(25, 135, 84, 0.15);
        }

        h1 {
            margin: 0 0 18px;

            color: var(--primary-dark);
            font-size: clamp(2rem, 5vw, 2.7rem);
            line-height: 1.15;
            font-weight: 700;
        }

        .lead {
            margin: 0 auto 14px;
            max-width: 560px;

            font-size: 1.18rem;
            line-height: 1.6;
        }

        .text {
            margin: 0 auto;
            max-width: 540px;

            color: var(--muted);
            font-size: 1rem;
            line-height: 1.65;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            margin-top: 30px;
            padding: 9px 15px;

            color: var(--primary-dark);
            background: var(--primary-light);
            border: 1px solid rgba(25, 135, 84, 0.15);
            border-radius: 999px;

            font-size: 0.92rem;
            font-weight: 600;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--primary);
        }

        footer {
            margin-top: 26px;
            color: var(--muted);
            font-size: 0.87rem;
        }

        a {
            color: var(--primary-dark);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 560px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 36px 24px 32px;
                border-radius: 15px;
            }

            .logo-mark {
                width: 68px;
                height: 68px;
                margin-bottom: 23px;
                font-size: 30px;
            }

            .lead {
                font-size: 1.08rem;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card" aria-labelledby="title">

            <div class="logo-mark">NBH</div>

            <h1 id="title">Wir sind bald wieder da</h1>

            <p class="lead">
                Die Website der Nachbarschaftshilfe wird gerade gewartet.
            </p>

            <p class="text">
                Wir führen derzeit notwendige Wartungsarbeiten durch,
                damit unsere Website weiterhin zuverlässig zur Verfügung steht.
            </p>

            <div class="status">
                <span class="status-dot" ></span>
                Wartungsarbeiten laufen
            </div>

            <footer>
                Vielen Dank für Ihr Verständnis.
            </footer>

        </section>
    </main>
</body>
</html>
