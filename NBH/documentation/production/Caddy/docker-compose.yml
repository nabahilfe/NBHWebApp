services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
	  - /srv/caddy/maintenance:/srv/maintenance:ro	  
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true

volumes:
  caddy_data:
  caddy_config:
