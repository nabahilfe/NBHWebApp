manual:
  path: "/NBHWebApp/testspecs" # optional path to specs root, defaults to "specs"
  publish_path: "/NBHWebApp/testspecs/reports" # optional Testspace result's path to publish status to, defaults to ""

issues:
  provider: # optional, defaults to "github:" (current org/repo)
  label: # optional, defaults to "testspace"

release: "*_rel" # optional one or more branch-wildcard entries

commit_status: false # optional, defaults to true
